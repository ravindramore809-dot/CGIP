<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGIP Library</title>
<style>
  :root {
    --bg: #eef2f6;
    --surface: #ffffff;
    --ink: #13202c;
    --muted: #5a6b7b;
    --line: #d3dce5;
    --accent: #0b5fd9;
    --accent-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720;
      --surface: #17212c;
      --ink: #e8eef4;
      --muted: #93a4b5;
      --line: #2a3745;
      --accent: #5b9bff;
      --accent-ink: #0b1520;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 22px; color: var(--muted); }
  .search {
    position: sticky; top: 0; z-index: 2;
    padding: 10px 0 12px; background: var(--bg);
  }
  .search input {
    width: 100%; font: inherit; font-size: 1.05rem;
    padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink);
  }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .count { margin: 6px 2px 0; font-size: 0.9rem; color: var(--muted); }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li + li { margin-top: 10px; }
  a.item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  a.item:hover { border-color: var(--accent); }
  a.item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .badge {
    flex: none; width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 0.8rem;
  }
  .name { font-weight: 600; }
  .hint { font-size: 0.85rem; color: var(--muted); }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>CGIP Library</h1>
  <p class="sub">Computer Graphics and Image Processing: experiment PDFs</p>

  <div class="search">
    <input id="q" type="search" placeholder="Search, e.g. Exp5" aria-label="Search PDFs" autocomplete="off">
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>No PDF matches that search. Try a number like 3 or the word Exp.</p>
</main>

<script>
  var files = [
    { name: "Exp1 CGIP", file: "Exp1 CGIP.pdf" },
    { name: "Exp2 CGIP", file: "Exp2 CGIP.pdf" },
    { name: "Exp3 CGIP", file: "Exp3 CGIP.pdf" },
    { name: "Exp4 CGIP", file: "Exp4 CGIP.pdf" },
    { name: "Exp5 CGIP", file: "Exp5 CGIP.pdf" },
    { name: "Exp6 CGIP", file: "Exp6 CGIP.pdf" },
    { name: "Exp7 CGIP", file: "Exp7 CGIP.pdf" },
    { name: "Exp8 CGIP", file: "Exp8 CGIP.pdf" },
    { name: "Exp9 CGIP", file: "Exp9 CGIP.pdf" },
    { name: "Exp10 CGIP", file: "Exp10 CGIP.pdf" }
  ];

  var list = document.getElementById("list");
  var q = document.getElementById("q");
  var count = document.getElementById("count");
  var empty = document.getElementById("empty");

  function fileUrl(file) {
    return new URL(encodeURIComponent(file), location.href).href;
  }
  function viewLink(file) {
    var direct = fileUrl(file);
    if (/Android/i.test(navigator.userAgent)) {
      return "https://docs.google.com/viewer?url=" + encodeURIComponent(direct);
    }
    return direct;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var shown = files.filter(function (f) {
      return f.name.toLowerCase().indexOf(term) !== -1;
    });
    list.innerHTML = "";
    shown.forEach(function (f) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "item";
      a.href = viewLink(f.file);
      a.target = "_blank";
      a.rel = "noopener";
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "PDF";
      var text = document.createElement("span");
      var n = document.createElement("div");
      n.className = "name";
      n.textContent = f.name;
      var h = document.createElement("div");
      h.className = "hint";
      h.textContent = "Tap to view";
      text.appendChild(n);
      text.appendChild(h);
      a.appendChild(badge);
      a.appendChild(text);
      li.appendChild(a);
      list.appendChild(li);
    });
    count.textContent = "Showing " + shown.length + " of " + files.length;
    empty.hidden = shown.length !== 0;
  }

  q.addEventListener("input", render);
  render();
</script>
</body>
</html>
