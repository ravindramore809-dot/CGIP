<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Library</title>
<style>
  :root {
    --bg: #eef2f6;
    --surface: #ffffff;
    --ink: #13202c;
    --muted: #5a6b7b;
    --line: #d3dce5;
    --accent: #0b5fd9;
    --accent-ink: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1720;
      --surface: #17212c;
      --ink: #e8eef4;
      --muted: #93a4b5;
      --line: #2a3745;
      --accent: #5b9bff;
      --accent-ink: #0b1520;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.9rem; line-height: 1.15; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { margin: 0 0 22px; color: var(--muted); }
  .search { position: sticky; top: 0; z-index: 2; padding: 10px 0 12px; background: var(--bg); }
  .search input {
    width: 100%; font: inherit; font-size: 1.05rem;
    padding: 14px 16px; border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--surface); color: var(--ink);
  }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  .count { margin: 6px 2px 0; font-size: 0.9rem; color: var(--muted); }
  ul { list-style: none; margin: 8px 0 0; padding: 0; }
  li + li { margin-top: 10px; }
  a.item {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  a.item:hover { border-color: var(--accent); }
  a.item:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .badge {
    flex: none; width: 44px; height: 44px; border-radius: 10px;
    display: grid; place-items: center;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 0.8rem;
  }
  .name { font-weight: 600; }
  .hint { font-size: 0.85rem; color: var(--muted); }
  li.group { margin: 20px 2px 2px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  li.group:first-child { margin-top: 4px; }
  .pimg { display: block; margin: 0 auto 10px; max-width: none; height: auto; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .empty { padding: 28px 8px; text-align: center; color: var(--muted); }
  [hidden] { display: none !important; }

  /* PDF viewer */
  #viewer { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #3b4350; }
  .vbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .vbar button, .vbar a {
    flex: none; font: inherit; font-size: 0.95rem; font-weight: 600;
    min-height: 40px; min-width: 40px; padding: 0 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink);
    display: inline-grid; place-items: center; text-decoration: none; cursor: pointer;
  }
  .vbar button:focus-visible, .vbar a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #vtitle { flex: 1; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vscroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 8px; }
  #vpages { width: max-content; min-width: 100%; }
  .page { position: relative; margin: 0 auto 10px; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
  .textLayer { position: absolute; inset: 0; overflow: hidden; line-height: 1; text-size-adjust: none; -webkit-user-select: text; user-select: text; }
  .textLayer span, .textLayer br { position: absolute; color: transparent; white-space: pre; cursor: text; transform-origin: 0% 0%; }
  .textLayer ::selection { background: rgba(11, 95, 217, 0.35); }
  .page canvas { display: block; }
  #vmsg { color: #fff; text-align: center; padding: 24px 12px; margin: 0; }
  #vmsg a { color: #fff; }
</style>
</head>
<body>
<main>
  <h1>Study Library</h1>
  <p class="sub">Practical files: CGIP and Power Systems</p>

  <div class="search">
    <input id="q" type="search" placeholder="Search, e.g. Exp5 or PS 4th" aria-label="Search PDFs" autocomplete="off">
    <div class="count" id="count" aria-live="polite"></div>
  </div>

  <ul id="list"></ul>
  <p class="empty" id="empty" hidden>No PDF matches that search. Try a number like 3 or the word Exp.</p>
</main>

<div id="viewer" hidden role="dialog" aria-label="PDF viewer">
  <div class="vbar">
    <button id="vback" type="button" aria-label="Back to list">Back</button>
    <span id="vtitle"></span>
    <button id="zout" type="button" aria-label="Zoom out">&minus;</button>
    <button id="zin" type="button" aria-label="Zoom in">+</button>
    <a id="vdl" href="#" download>Save</a>
  </div>
  <div id="vscroll">
    <p id="vmsg"></p>
    <div id="vpages"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  var files = [
    { group: "CGIP", name: "Exp1 CGIP", file: "Exp1 CGIP.pdf" },
    { group: "CGIP", name: "Exp2 CGIP", file: "Exp2 CGIP.pdf" },
    { group: "CGIP", name: "Exp3 CGIP", file: "Exp3 CGIP.pdf" },
    { group: "CGIP", name: "Exp4 CGIP", file: "Exp4 CGIP.pdf" },
    { group: "CGIP", name: "Exp5 CGIP", file: "Exp5 CGIP.pdf" },
    { group: "CGIP", name: "Exp6 CGIP", file: "Exp6 CGIP.pdf" },
    { group: "CGIP", name: "Exp7 CGIP", file: "Exp7 CGIP.pdf" },
    { group: "CGIP", name: "Exp8 CGIP", file: "Exp8 CGIP.pdf" },
    { group: "CGIP", name: "Exp9 CGIP", file: "Exp9 CGIP.pdf" },
    { group: "CGIP", name: "Exp10 CGIP", file: "Exp10 CGIP.pdf" },
    { group: "Power Systems", name: "PS 2nd PR: Code", file: "PS_2nd_PR_CODE_.jpg" },
    { group: "Power Systems", name: "PS 3rd PR: Code", file: "PS_3rd_PR_CODE.pdf" },
    { group: "Power Systems", name: "PS 4th PR: Bus Admittance Matrix", file: "PS_4th_PR_BUS_ADMMITANCE_MATRIX.pdf" },
    { group: "Power Systems", name: "PS 5th PR: Code", file: "PS_5th_PR_CODE.jpg" }
  ];

  var list = document.getElementById("list");
  var q = document.getElementById("q");
  var count = document.getElementById("count");
  var empty = document.getElementById("empty");

  function fileUrl(file) {
    return new URL(encodeURIComponent(file), location.href).href;
  }

  function render() {
    var term = q.value.trim().toLowerCase();
    var shown = files.filter(function (f) {
      return (f.group + " " + f.name).toLowerCase().indexOf(term) !== -1;
    });
    list.innerHTML = "";
    var lastGroup = "";
    shown.forEach(function (f) {
      if (f.group !== lastGroup) {
        lastGroup = f.group;
        var gh = document.createElement("li");
        gh.className = "group";
        gh.textContent = f.group;
        list.appendChild(gh);
      }
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "item";
      a.href = fileUrl(f.file);
      a.addEventListener("click", function (e) {
        if (e.ctrlKey || e.metaKey || e.shiftKey) return;
        e.preventDefault();
        openViewer(f);
      });
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "PDF";
      var text = document.createElement("span");
      var n = document.createElement("div");
      n.className = "name";
      n.textContent = f.name;
      var h = document.createElement("div");
      h.className = "hint";
      h.textContent = "Tap to view";
      text.appendChild(n);
      text.appendChild(h);
      a.appendChild(badge);
      a.appendChild(text);
      li.appendChild(a);
      list.appendChild(li);
    });
    count.textContent = "Showing " + shown.length + " of " + files.length;
    empty.hidden = shown.length !== 0;
  }
  q.addEventListener("input", render);
  render();

  /* ---------- In-page PDF viewer (PDF.js) ---------- */
  var viewer = document.getElementById("viewer");
  var vscroll = document.getElementById("vscroll");
  var vpages = document.getElementById("vpages");
  var vmsg = document.getElementById("vmsg");
  var vtitle = document.getElementById("vtitle");
  var vdl = document.getElementById("vdl");
  var pdfDoc = null, zoom = 1, token = 0, observer = null, current = null;

  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  }

  function fallbackMessage(f) {
    vmsg.innerHTML = "";
    vmsg.appendChild(document.createTextNode("This PDF could not be shown here. "));
    var a = document.createElement("a");
    a.href = fileUrl(f.file);
    a.textContent = "Open it directly";
    vmsg.appendChild(a);
    vmsg.appendChild(document.createTextNode("."));
  }

  function isImage(f) { return /\.(jpe?g|png|webp|gif)$/i.test(f.file); }

  function buildImage() {
    vpages.innerHTML = "";
    var img = new Image();
    img.className = "pimg";
    img.alt = current.name;
    img.style.width = Math.round((vscroll.clientWidth - 16) * zoom) + "px";
    img.onload = function () { vmsg.textContent = ""; };
    img.onerror = function () { fallbackMessage(current); };
    img.src = fileUrl(current.file);
    vpages.appendChild(img);
  }

  function openViewer(f) {
    current = f;
    zoom = 1;
    var my = ++token;
    vtitle.textContent = f.name;
    vdl.href = fileUrl(f.file);
    vdl.setAttribute("download", f.file);
    vpages.innerHTML = "";
    vmsg.textContent = "Loading…";
    viewer.hidden = false;
    document.body.style.overflow = "hidden";
    history.pushState({ v: 1 }, "");
    if (isImage(f)) { buildImage(); return; }
    if (!window.pdfjsLib) { fallbackMessage(f); return; }
    pdfjsLib.getDocument(fileUrl(f.file)).promise.then(function (doc) {
      if (my !== token) return;
      pdfDoc = doc;
      vmsg.textContent = "";
      build();
    }).catch(function () {
      if (my === token) fallbackMessage(f);
    });
  }

  function closeViewer() {
    token++;
    viewer.hidden = true;
    document.body.style.overflow = "";
    if (observer) observer.disconnect();
    vpages.innerHTML = "";
    if (pdfDoc) { pdfDoc.destroy(); pdfDoc = null; }
  }

  function build() {
    if (current && isImage(current)) { buildImage(); return; }
    if (!pdfDoc) return;
    if (observer) observer.disconnect();
    vpages.innerHTML = "";
    var cssW = Math.round((vscroll.clientWidth - 16) * zoom);
    var doc = pdfDoc, my = token;
    observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting && !en.target.dataset.done) {
          en.target.dataset.done = "1";
          renderPage(doc, my, en.target, cssW);
        }
      });
    }, { root: vscroll, rootMargin: "700px 0px" });
    for (var i = 1; i <= doc.numPages; i++) {
      var div = document.createElement("div");
      div.className = "page";
      div.dataset.n = i;
      div.style.width = cssW + "px";
      div.style.height = Math.round(cssW * 1.414) + "px";
      vpages.appendChild(div);
      observer.observe(div);
    }
  }

  function renderPage(doc, my, div, cssW) {
    doc.getPage(+div.dataset.n).then(function (page) {
      if (my !== token) return;
      var base = page.getViewport({ scale: 1 });
      var cssScale = cssW / base.width;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var vp = page.getViewport({ scale: cssScale * dpr });
      var vpCss = page.getViewport({ scale: cssScale });
      var canvas = document.createElement("canvas");
      canvas.width = Math.floor(vp.width);
      canvas.height = Math.floor(vp.height);
      canvas.style.width = cssW + "px";
      canvas.style.height = Math.round(vpCss.height) + "px";
      div.style.height = canvas.style.height;
      div.appendChild(canvas);
      var drawn = page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;

      /* invisible text on top of the picture so words can be selected and copied */
      page.getTextContent().then(function (tc) {
        if (my !== token || !pdfjsLib.renderTextLayer) return;
        var layer = document.createElement("div");
        layer.className = "textLayer";
        layer.style.setProperty("--scale-factor", cssScale);
        div.appendChild(layer);
        pdfjsLib.renderTextLayer({
          textContentSource: tc,
          textContent: tc,
          container: layer,
          viewport: vpCss,
          textDivs: []
        });
      }).catch(function () {});
      return drawn;
    }).catch(function () {});
  }

  document.getElementById("vback").addEventListener("click", function () { history.back(); });
  window.addEventListener("popstate", function () { if (!viewer.hidden) closeViewer(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !viewer.hidden) history.back();
  });
  document.getElementById("zin").addEventListener("click", function () {
    zoom = Math.min(3, +(zoom + 0.25).toFixed(2)); build();
  });
  document.getElementById("zout").addEventListener("click", function () {
    zoom = Math.max(0.5, +(zoom - 0.25).toFixed(2)); build();
  });
</script>
</body>
</html>
